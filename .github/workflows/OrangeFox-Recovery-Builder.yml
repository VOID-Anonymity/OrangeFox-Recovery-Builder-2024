name: OrangeFox - Build

on:
  workflow_dispatch:
    inputs:
      MANIFEST_BRANCH:
        description: 'OrangeFox Branch'
        required: true
        default: '12.1'
        type: choice
        options:
        - 14.1
        - 12.1
        - 11.0
      DEVICE_TREE:
        description: 'Custom Recovery Tree'
        required: true
        default: 'https://github.com/VOID-Anonymity/digma_orangefox'
      DEVICE_TREE_BRANCH:
        description: 'Custom Recovery Tree Branch'
        required: true
        default: 'main'
      DEVICE_PATH:
        description: 'Specify your device path.'
        required: true
        default: 'device/digma/citi609'
      DEVICE_NAME:
        description: 'Specify your Device Codename.'
        required: true
        default: 'citi609'
      BUILD_TARGET:
        description: 'Specify your Build Target'
        required: true
        default: 'recovery'
        type: choice
        options:
        - boot
        - recovery
        - vendorboot
      LDCHECK:
        description: 'Path of blobs to check'
        required: false
        default: 'sbin/recovery'
      RECOVERY_TAR:
        description: 'Release recovery.tar For Samsung devices'
        required: false
        default: false
        type: boolean
      RECOVERY_INSTALLER:
        description: 'Include recovery installer zip'
        type: boolean
        required: true
        default: true

jobs:
  build:
    name: Build OFRP by ${{ github.actor }}
    runs-on: ubuntu-latest
    if: github.event.repository.owner.id == github.event.sender.id
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    permissions:
      contents: write
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Clean-up
      uses: rokibhasansagar/slimhub_actions@main

    - name: Swap Space
      uses: pierotofy/set-swap-space@master
      with:
        swap-size-gb: 24

    - name: Build Environment
      run: |
        sudo apt update
        sudo apt -y upgrade
        git clone https://gitlab.com/OrangeFox/misc/scripts
        cd scripts
        sudo bash setup/android_build_env.sh

    - name: Set-up Manifest
      if: github.event.inputs.MANIFEST_BRANCH == '11.0' || github.event.inputs.MANIFEST_BRANCH == '12.1' || github.event.inputs.MANIFEST_BRANCH == '14.1'
      run: |
        mkdir -p ${GITHUB_WORKSPACE}/OrangeFox
        cd ${GITHUB_WORKSPACE}/OrangeFox
        git config --global user.name "VOID-Anonymity"
        git config --global user.email "kinguser981@gmail.com"
        git clone https://gitlab.com/OrangeFox/sync.git
        cd sync
        ./orangefox_sync.sh --branch ${{ github.event.inputs.MANIFEST_BRANCH }} --path ${GITHUB_WORKSPACE}/OrangeFox/fox_${{ github.event.inputs.MANIFEST_BRANCH }}

    - name: Clone & Auto-Fix Device Tree
      run: |
        cd ${GITHUB_WORKSPACE}/OrangeFox/fox_${{ github.event.inputs.MANIFEST_BRANCH }}
        git clone ${{ github.event.inputs.DEVICE_TREE }} -b ${{ github.event.inputs.DEVICE_TREE_BRANCH }} ./${{ github.event.inputs.DEVICE_PATH }}
        cd ${{ github.event.inputs.DEVICE_PATH }}
        echo "COMMIT_ID=$(git rev-parse HEAD)" >> $GITHUB_ENV

        # Авто-чистка конфликтов в дереве устройства
        rm -rf recovery/root/vendor
        sed -i '/BOARD_BUILD_SYSTEM_ROOT_IMAGE/d' BoardConfig.mk
        if ! grep -q "FOX_BEFORE_RECOVERY_IMAGE_HOOK" BoardConfig.mk; then
          echo 'FOX_BEFORE_RECOVERY_IMAGE_HOOK := rm -rf $(TARGET_RECOVERY_ROOT_OUT)/vendor' >> BoardConfig.mk
        fi

        # Патчим rsync в исходниках OrangeFox, чтобы --force сносил непустые папки при замене на симлинк
        cd ${GITHUB_WORKSPACE}/OrangeFox/fox_${{ github.event.inputs.MANIFEST_BRANCH }}
        grep -rn "rsync " vendor/recovery/ bootable/recovery/ 2>/dev/null | cut -d: -f1 | sort -u | xargs -r sed -i 's/rsync -a/rsync -a --force/g'

    - name: Fast Config Check (Fail-Fast)
      run: |
        cd ${GITHUB_WORKSPACE}/OrangeFox/fox_${{ github.event.inputs.MANIFEST_BRANCH }}
        TREE_DIR="${{ github.event.inputs.DEVICE_PATH }}"

        echo "=========================================="
        echo "🔍 ЗАПУСК ПОЛНОЙ ДИАГНОСТИКИ ДЕРЕВА..."
        echo "=========================================="

        # 1. Проверка базовых файлов дерева
        for FILE in BoardConfig.mk AndroidProducts.mk device.mk recovery.fstab; do
          if [ ! -f "${TREE_DIR}/${FILE}" ]; then
            echo "❌ ТУТ БАГ! Не найден обязательный файл: ${TREE_DIR}/${FILE}"
            exit 1
          fi
        done
        echo "Проверка структуры файлов дерева... ✅"

        # 2. Проверка ядра (kernel)
        if [ ! -f "${TREE_DIR}/prebuilt/kernel" ] && [ ! -f "${TREE_DIR}/kernel" ]; then
          echo "❌ ТУТ БАГ! Не найден бинарник ядра (prebuilt/kernel или kernel)!"
          exit 1
        fi
        echo "Проверка наличия ядра (kernel)... ✅"

        # 3. Проверка отсутствия конфликта vendor и применения патча rsync --force
        if [ -d "${TREE_DIR}/recovery/root/vendor" ] || grep -q "BOARD_BUILD_SYSTEM_ROOT_IMAGE" "${TREE_DIR}/BoardConfig.mk"; then
          echo "❌ ТУТ БАГ! Обнаружен конфликт root/vendor или BOARD_BUILD_SYSTEM_ROOT_IMAGE!"
          exit 1
        fi
        if ! grep -rq -- "--force" vendor/recovery/ bootable/recovery/ 2>/dev/null; then
          echo "❌ ТУТ БАГ! Патч rsync --force не применился в vendor/recovery или bootable/recovery!"
          exit 1
        fi
        echo "Проверка чистоты рамдиска и патча rsync --force... ✅"

        # 4. Проверка совместимости и lunch через AOSP
        set +e
        source build/envsetup.sh > /dev/null 2>&1
        export ALLOW_MISSING_DEPENDENCIES=true
        if [ "${{ github.event.inputs.MANIFEST_BRANCH }}" = "11.0" ] || [ "${{ github.event.inputs.MANIFEST_BRANCH }}" = "12.1" ]; then
          lunch twrp_${{ github.event.inputs.DEVICE_NAME }}-eng
        else
          lunch omni_${{ github.event.inputs.DEVICE_NAME }}-eng
        fi
        RES=$?
        set -e

        if [ $RES -ne 0 ]; then
          echo "❌ ТУТ БАГ! Система сборки не приняла lunch для ${{ github.event.inputs.DEVICE_NAME }}!"
          exit 1
        fi
        echo "Проверка совместимости (lunch)... ✅"

        # 5. Проверка переменных экрана и раздела
        set +e
        PIXEL_FMT=$(get_build_var TARGET_RECOVERY_PIXEL_FORMAT 2>/dev/null)
        PART_SIZE=$(get_build_var BOARD_RECOVERYIMAGE_PARTITION_SIZE 2>/dev/null)
        set -e

        if [ -z "${PART_SIZE}" ]; then
          echo "❌ ТУТ БАГ! Не задан размер раздела BOARD_RECOVERYIMAGE_PARTITION_SIZE!"
          exit 1
        fi
        echo "Проверка поддержки и конфигов (Формат: ${PIXEL_FMT:-AUTO}, Раздел: ${PART_SIZE} байт)... ✅"
        echo "=========================================="
        echo "🚀 ВСЕ ПРОВЕРКИ ПРОЙДЕНЫ! СТАРТУЕМ СБОРКУ!"
        echo "=========================================="

    - name: Check Manifest Branch
      uses: haya14busa/action-cond@v1
      id: fox_branch
      with:
        cond: ${{ github.event.inputs.MANIFEST_BRANCH == '11.0' || github.event.inputs.MANIFEST_BRANCH == '12.1' }}
        if_true: lunch twrp_${{ github.event.inputs.DEVICE_NAME }}-eng && make clean && mka adbd ${{ github.event.inputs.BUILD_TARGET }}image
        if_false: lunch omni_${{ github.event.inputs.DEVICE_NAME }}-eng && make clean && mka ${{ github.event.inputs.BUILD_TARGET }}image

    - name: Building OrangeFox
      run: |
        cd ${GITHUB_WORKSPACE}/OrangeFox/fox_${{ github.event.inputs.MANIFEST_BRANCH }}
        set +e
        source build/envsetup.sh
        export ALLOW_MISSING_DEPENDENCIES=true
        set -e
        ${{ steps.fox_branch.outputs.value }}

    - name: Set Build Date
      run: |
        echo "BUILD_DATE=$(date +%Y%m%d)" >> $GITHUB_ENV
        DEVICE_TREE_URL="${{ github.event.inputs.DEVICE_TREE }}"
        if [[ "${DEVICE_TREE_URL}" == *.git ]]; then
          DEVICE_TREE_URL="${DEVICE_TREE_URL%.git}"
        fi
        echo "DEVICE_TREE_URL=${DEVICE_TREE_URL}" >> $GITHUB_ENV

    - name: Check if Recovery Exist
      run: |
        cd ${GITHUB_WORKSPACE}/OrangeFox/fox_${{ github.event.inputs.MANIFEST_BRANCH }}
        OUT_DIR="out/target/product/${{ github.event.inputs.DEVICE_NAME }}"
        if ls ${OUT_DIR}/OrangeFox*.img 1> /dev/null 2>&1; then
            echo "CHECK_IMG_IS_OK=true" >> $GITHUB_ENV
            echo "FILE_PATH=${GITHUB_WORKSPACE}/OrangeFox/fox_${{ github.event.inputs.MANIFEST_BRANCH }}/${OUT_DIR}" >> $GITHUB_ENV
            echo "MD5_IMG=$(md5sum ${OUT_DIR}/OrangeFox*.img | cut -d ' ' -f 1)" >> $GITHUB_ENV
        else
            echo "❌ ТУТ БАГ! Финальный образ OrangeFox*.img не создался!"
            exit 1
        fi

    - name: Rename the Recovery
      run: |
        cd ${{ env.FILE_PATH }}/
        if [ "${{ github.event.inputs.BUILD_TARGET }}" = "boot" ]; then
          cp OrangeFox*.img boot.img
          echo "RECOVERY_TYPE=boot" >> $GITHUB_ENV
        elif [ "${{ github.event.inputs.BUILD_TARGET }}" = "recovery" ]; then
          cp OrangeFox*.img recovery.img
          echo "RECOVERY_TYPE=recovery" >> $GITHUB_ENV
        elif [ "${{ github.event.inputs.BUILD_TARGET }}" = "vendorboot" ]; then
          cp OrangeFox*.img vendor_boot.img
          echo "RECOVERY_TYPE=vendor_boot" >> $GITHUB_ENV
        fi
      continue-on-error: true

    - name: Include Recovery Installer
      run: |
        if [ "${{ github.event.inputs.RECOVERY_INSTALLER }}" = "true" ]; then
          cd ${{ env.FILE_PATH }}/
          wget -q https://github.com/kinguser981/recovery-installer/releases/download/11256427880/recovery-installer.zip
          zip -ur recovery-installer.zip ${{ env.RECOVERY_TYPE }}.img
        fi
      continue-on-error: true

    - name: Upload to Release
      if: env.CHECK_IMG_IS_OK == 'true'
      uses: softprops/action-gh-release@v2
      with:
        files: |
          ${{ env.FILE_PATH }}/${{ env.RECOVERY_TYPE }}.img
          ${{ env.FILE_PATH }}/recovery-installer.zip
          ${{ env.FILE_PATH }}/OrangeFox*.zip
        name: Unofficial OrangeFox for ${{ github.event.inputs.DEVICE_NAME }} // ${{ env.BUILD_DATE }}
        tag_name: build-${{ github.run_id }}
        body: |
          Build: ${{ github.event.inputs.MANIFEST_BRANCH }}
          Device: [Device Tree](${{ env.DEVICE_TREE_URL }}/tree/${{ github.event.inputs.DEVICE_TREE_BRANCH }})
          Commit: `${{ env.COMMIT_ID }}`
          MD5 (img): `${{ env.MD5_IMG }}`

    - name: Upload Artifacts (Backup)
      if: env.CHECK_IMG_IS_OK == 'true'
      uses: actions/upload-artifact@v4
      with:
        name: OrangeFox-${{ github.event.inputs.DEVICE_NAME }}-${{ env.BUILD_DATE }}
        path: |
          ${{ env.FILE_PATH }}/${{ env.RECOVERY_TYPE }}.img
          ${{ env.FILE_PATH }}/OrangeFox*.zip
